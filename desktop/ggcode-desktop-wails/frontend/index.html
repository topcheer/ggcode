<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>GGCode Desktop</title>
    <script>
        // Paint the theme before React mounts: reads the saved mode the same way
        // useTheme does ('auto' follows the OS). Previously the body was pinned
        // to the dark background, so light users saw a dark flash on launch.
        (function () {
            try {
                var m = localStorage.getItem('ggcode-theme');
                var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.classList.toggle('dark', dark);
                document.documentElement.style.backgroundColor = dark ? '#0D1117' : '#FFFFFF';
            } catch (e) { }
        })();
    </script>
    <style>
        html, body { margin: 0; padding: 0; overflow: hidden; background-color: inherit; }
    </style>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
