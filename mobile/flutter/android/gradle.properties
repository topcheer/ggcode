# Keep this file portable: no machine-specific JVM flags (see #3182).
# If your network needs a custom hosts mapping for jitpack resolution,
# inject it OUTSIDE the repo instead, e.g. in ~/.gradle/gradle.properties:
#   org.gradle.jvmargs=-Xmx4G -Djdk.net.hosts.file=/tmp/gradle-hosts
# or via GRADLE_OPTS. CI runners resolve jitpack normally and must stay
# independent of any pre-staged /tmp/gradle-hosts file.
org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.ndkVersion=27.1.12297006
