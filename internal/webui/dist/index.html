<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ggcode</title>
    <script>
      // 主题先行:localStorage → system,避免闪白
      try {
        var t = localStorage.getItem("ggcode-theme") || "dark";
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.classList.add(t);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <script type="module" crossorigin src="/assets/index-CZc7lis1.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D0h7V5bV.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
