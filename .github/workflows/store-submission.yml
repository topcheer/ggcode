name: store-submission

# Build MSIX packages and submit them to Microsoft Store certification
# via the official Store Submission API. Manual trigger only - each
# submission enters the 1-3 day certification pipeline.
#
# Required repo secrets (see STORE_SUBMISSION.md for one-time setup):
#   STORE_TENANT_ID / STORE_CLIENT_ID / STORE_CLIENT_SECRET / STORE_PRODUCT_ID
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Four-part package version (e.g. 1.3.269.0)"
        required: true
      release_notes:
        description: "What's new notes (optional)"
        required: false
        default: ""
      resume_submission_id:
        description: "Resume an existing draft submission id (optional, for crash recovery)"
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  dedup:
    name: Tag fan-out dedup guard (#5480)
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          WF_FILE: store-submission.yml
        run: |
          set -eu
          # #5480: a tag push fans out to four release pipelines; re-pushing
          # the same tag must not re-submit a pipeline that already completed
          # for that tag (Store API resume/409 guards drafts, but a committed
          # in-certification submission would be duplicated). Manual dispatch
          # is an explicit redo request and never skips.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WF_FILE/runs?event=push&per_page=30" \
            --jq '.workflow_runs[] | select(.head_branch == "${{ github.ref_name }}" and .status == "completed" and .conclusion == "success" and .id != ${{ github.run_id }}) | .id' | head -n1 || true)
          if [ -n "$prior" ]; then
            echo "prior successful run #$prior for tag ${{ github.ref_name }} - skipping duplicate fan-out"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-submit:
    name: Build + submit to Store
    needs: dedup
    if: needs.dedup.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve version from tag (v1.3.269 -> 1.3.269.0)
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw "unparseable version: $v" }
          if ($v.Split('.').Count -eq 3) { $v = "$v.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build MSIX packages
        shell: pwsh
        run: .\scripts\release\build-desktop-msix.ps1 -Version "${{ steps.ver.outputs.version }}" -OutputDir dist -IdentityName "GuangGuangAIStudio.GGCodeDesktop" -Publisher "CN=C2C7AF54-16DE-44AC-9393-7EA6D433CCD2" -Archs "x64"

      - name: Submit to Microsoft Store
        shell: pwsh
        env:
          TENANT: ${{ secrets.STORE_TENANT_ID }}
          CLIENT: ${{ secrets.STORE_CLIENT_ID }}
          SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
        run: .\scripts\release\submit-store.ps1 -TenantId $env:TENANT -ClientId $env:CLIENT -ClientSecret $env:SECRET -ProductId "${{ secrets.STORE_PRODUCT_ID }}" -PackageDir dist -ReleaseNotes "${{ github.event.inputs.release_notes }}" -ResumeSubmissionId "${{ github.event.inputs.resume_submission_id }}"

      - name: Keep packages as artifact (audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: submitted-msix
          path: dist/*.msix
          if-no-files-found: error
