name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      # #3613: Flutter-generated artifacts must stay untracked. A local
      # flutter build regenerates them with the local version stamp;
      # re-tracking reintroduces the stale-stamp drift (1.3.250 vs pubspec
      # 1.3.255) that dirtied trees and confused release sweeps.
      - run: |
          tracked="$(git ls-files mobile/flutter/ios/Flutter/Generated.xcconfig mobile/flutter/ios/Flutter/flutter_export_environment.sh)"
          if [ -n "$tracked" ]; then
            echo "::error::Flutter build artifacts are tracked again (#3613): $tracked"
            echo "::error::Remove them from the index (git rm --cached) - they are regenerated by flutter build and must stay gitignored."
            exit 1
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -tags goolm -o /tmp/ggcode ./cmd/ggcode
      - run: GOOS=windows GOARCH=amd64 go build -tags goolm ./...
      - run: GOOS=darwin GOARCH=arm64 go build -tags goolm ./...
      - run: go vet -tags goolm ./...
      - run: git config --global user.name "CI" && git config --global user.email "ci@ggcode.dev"
      - run: GOMEMLIMIT=2GiB GOGC=50 go test -tags goolm -p 1 -timeout 300s ./cmd/... ./internal/... ./desktop/wailskit/...

  # Gate: the embedded webui dist must be rebuilt whenever web/ changes.
  # Guards against "edited web/ but forgot make build-all" shipping a
  # binary with a stale embedded frontend.
  webui-dist-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            webui:
              - 'web/**'
              - 'internal/webui/dist/**'
      - name: Rebuild webui and verify dist is up to date
        if: steps.filter.outputs.webui == 'true'
        run: |
          corepack enable
          # #5366: the pnpm project lives in web/ (no root manifest) - mirror
          # the Makefile webui-build target instead of running at repo root.
          corepack pnpm -C web install --frozen-lockfile --prefer-offline
          corepack pnpm -C web run build
          if ! git diff --quiet -- internal/webui/dist; then
            echo "::error::internal/webui/dist is stale: the committed dist does not match a rebuild of web/. Run 'make build-all' (webui-build + webui-sync-artifacts) and commit the refreshed artifacts."
            git diff --stat -- internal/webui/dist
            exit 1
          fi

  # Gate: the flutter test suite must run at PR time when mobile code
  # changes. Before #5384 the suite only ran in the Mobile Release workflow
  # (tag push), so a PR that broke mobile tests passed CI green and the
  # breakage only surfaced at release time (v1.3.278: the #5379
  # session_provider_test red shipped to main through green PRs and exploded
  # in the release Verify step). Mirrors the webui-dist-freshness shape so
  # the cost only lands where mobile changes; the release workflow keeps its
  # full-matrix verify (pub get + analyze + test).
  mobile-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' }}
    env:
      FLUTTER_VERSION: '3.47.9'
    defaults:
      run:
        working-directory: mobile/flutter
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'mobile/**'
      - name: Setup Flutter
        if: steps.filter.outputs.mobile == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Get dependencies
        if: steps.filter.outputs.mobile == 'true'
        run: flutter pub get
      - name: Test
        if: steps.filter.outputs.mobile == 'true'
        run: flutter test

  lint:
    name: Format
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Format only runs gofmt; it never downloads modules. With cache
          # enabled its post step races the Test job and saves an empty
          # module-cache stub under the shared go.sum key, poisoning it
          # (cache entries are immutable per key). Only Test seeds the cache.
          cache: false
      - run: test -z "$(gofmt -l .)"
