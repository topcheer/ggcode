name: model-caps-sync

# Weekly sync of the built-in model capability database from models.dev
# (single source since v1.3.234; replaced charmbracelet/catwalk + OpenRouter
# fallback). Runs make sync-model-caps and opens a PR when the generated
# files (internal/config/context_window.go, vendor_defaults.go) change so
# new models/providers flow into releases without manual tracking.

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write # PR-creation fallback path (see Create pull request step)

concurrency:
  group: model-caps-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run sync
        run: make sync-model-caps

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet internal/config/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify generated code
        if: steps.diff.outputs.changed == 'true'
        run: |
          go build -tags goolm ./internal/config/
          go test -tags goolm ./internal/config/ -count=1
            
      # Once the repo enables Settings → Actions → General → Workflow
      # permissions → "Allow GitHub Actions to create and approve pull
      # requests", the gh pr create path below starts working automatically;
      # until then the issue fallback keeps every weekly run green while
      # still surfacing the pushed branch for review. The step ALWAYS exits 0
      # so the scheduled run conclusion reflects the sync itself.
      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="chore/model-caps-sync-$(date +%Y%m%d)"
          git config user.name "ggcode-bot"
          git config user.email "noreply@ggcode.dev"
          git checkout -b "$BRANCH"
          git add internal/config/context_window.go internal/config/vendor_defaults.go
          git commit -m "chore(config): weekly model caps sync from models.dev" \
            -m "Auto-generated by the model-caps-sync workflow. Source: models.dev api.json." \
            -m "Co-Authored-By: ggcode <noreply@ggcode.dev>"
          git push origin "$BRANCH"
          if gh pr create \
            --title "chore(config): weekly model caps sync from models.dev" \
            --body "Automated sync from https://models.dev (api.json). Review the vendor_defaults.go / context_window.go diff for unexpected capability changes." \
            --base main \
            --head "$BRANCH"; then
            exit 0
          fi
          echo "::warning::PR creation blocked by repo policy - falling back to a tracking issue"
          gh label create "model-caps-sync" --color 0e8a16 --description "Automated model-caps sync backlog" 2>/dev/null || true
          # Reuse one open tracking issue instead of spamming a new one weekly.
          ISSUE=$(gh issue list --label model-caps-sync --state open --json number --jq '.[0].number' 2>/dev/null)
          COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "Sync update pushed: [$BRANCH](${COMPARE_URL}) ($(date -u +%Y-%m-%dT%H:%MZ))"
          else
            gh issue create \
              --title "model-caps-sync: synced branches awaiting PR (repo policy blocks Actions-created PRs)" \
              --body "The weekly model-caps sync pushes review-ready branches but repo policy currently blocks Actions from creating PRs. Latest branch: [$BRANCH](${COMPARE_URL}). Once Settings → Actions → General → Workflow permissions enables “Allow GitHub Actions to create and approve pull requests”, PRs will be created directly and this issue can be closed." \
              --label model-caps-sync
          fi
          exit 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
