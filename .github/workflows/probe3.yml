name: probe3-dispatch-bisect
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package_version:
        description: "v"
        required: false
        default: "v0"
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: echo "probe3 v2 dispatch+tags"
