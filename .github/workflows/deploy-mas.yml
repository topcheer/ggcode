name: Deploy Mac App Store

# Dedicated MAS pipeline, split out of release-mas.yml (which stays as the
# multi-platform release/publish pipeline). Upstream (wails universal build,
# Distribution signing, sandbox entitlements, productbuild) is identical to
# the previous inline block; what changed:
#   1. Own workflow: a MAS-only failure or retry no longer rides a 13-job
#      dispatch (the startup_failure streak lived there).
#   2. altool upload migrated from the deprecated --upload-app flag to
#      --upload-package, with --validate-package first (Apple's asc-altool
#      page marks --upload-app deprecated).
#   3. Submit-for-review is automated: poll the build through ASC API
#      processing (VALID), then drive the reviewSubmissions API (the
#      appStoreVersionSubmissions endpoint is deprecated and 403s, see the
#      2026-11-06 iOS/macOS submission round). Implemented in
#      scripts/release/mas-submit-review.sh.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package_version:
        description: "Version label for manual packaging runs"
        required: false
        default: "v0.0.0"

concurrency:
  group: deploy-mas-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit-mas:
    name: Build, sign and submit GGCode Desktop (MAS)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
      APPLE_MAC_INSTALLER_P12: ${{ secrets.APPLE_MAC_INSTALLER_P12 }}
      APPLE_MAC_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_P12_PASSWORD }}
      APPLE_MAS_DISTRIBUTION_P12: ${{ secrets.APPLE_MAS_DISTRIBUTION_P12 }}
      APPLE_MAS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_MAS_DISTRIBUTION_P12_PASSWORD }}
      APPLE_MAS_PROFILE_BASE64: ${{ secrets.APPLE_MAS_PROFILE_BASE64 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions 2>/dev/null || true
          df -h /
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Capture build date
        shell: bash
        run: echo "GGCODE_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_ENV}"

      - name: Guard - MAS secrets configured?
        shell: bash
        run: |
          if [[ -z "${APPLE_MAC_INSTALLER_P12}" || -z "${APPLE_MAS_DISTRIBUTION_P12}" || -z "${APPLE_MAS_PROFILE_BASE64}" || -z "${APPLE_API_KEY_ID}" ]]; then
            echo "MAS secrets not configured - skipping (set APPLE_MAC_INSTALLER_P12, APPLE_MAS_DISTRIBUTION_P12, APPLE_MAS_PROFILE_BASE64, APPLE_API_KEY_ID[, APPLE_API_KEY_P8, APPLE_API_ISSUER_ID] to enable full automation)"
            exit 0
          fi
          echo "MAS_READY=true" >> "${GITHUB_ENV}"

      - name: Prepare Mac App Store credentials
        if: env.MAS_READY == 'true'
        shell: bash
        run: |
          # The login keychain (not a fresh custom one): importing the p12
          # into a custom keychain yields CSSMERR_TP_NOT_TRUSTED forever on
          # this runner class, the stock trust domain resolves the Apple
          # chain (round-7 verdict, validated 2026-11-05).
          KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p action "${KEYCHAIN}" 2>/dev/null || security unlock-keychain "${KEYCHAIN}" 2>/dev/null || true
          security default-keychain -s "${KEYCHAIN}"
          printf '%s' "${APPLE_MAC_INSTALLER_P12}" | base64 -d > "${RUNNER_TEMP}/installer.p12"
          security import "${RUNNER_TEMP}/installer.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_MAC_INSTALLER_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          printf '%s' "${APPLE_MAS_DISTRIBUTION_P12}" | base64 -d > "${RUNNER_TEMP}/dist.p12"
          security import "${RUNNER_TEMP}/dist.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_MAC_INSTALLER_P12_PASSWORD}" -T /usr/bin/codesign 2>/dev/null || \
          security import "${RUNNER_TEMP}/dist.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_MAS_DISTRIBUTION_P12_PASSWORD}" -T /usr/bin/codesign
          # WWDR G3 intermediate ships in-repo (public trust material; Apple
          # removed the G3 download page). Fail loud if it did not land.
          security import "${GITHUB_WORKSPACE}/scripts/certs/AppleWWDRCAG3.pem" -k "${KEYCHAIN}" -T /usr/bin/codesign
          if ! security find-certificate -c "Apple Worldwide Developer Relations" "${KEYCHAIN}" > /dev/null 2>&1; then
            echo "::error::WWDR G3 intermediate not found in keychain after import"
            exit 1
          fi
          # Partition list grants codesign access to the private keys. Each
          # Actions step is a separate process; without an explicit unlock +
          # partition grant the wails rebuild window can relock the keychain
          # (errSecInternalComponent, round-5).
          security unlock-keychain -p action "${KEYCHAIN}" 2>/dev/null || security unlock-keychain "${KEYCHAIN}" 2>/dev/null || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "${KEYCHAIN}" > /dev/null 2>&1 || \
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k action "${KEYCHAIN}" > /dev/null 2>&1 || true
          echo "--- pre-sign identity check ---"
          security find-identity -v -p codesigning

      - name: Build and sign universal MAS app
        if: env.MAS_READY == 'true'
        shell: bash
        run: |
          cd desktop/ggcode-desktop-wails
          KC="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p action "${KC}" || { echo "::error::cannot unlock login keychain"; exit 1; }
          # Identity gate BEFORE codesign: a hang at "replacing existing signature" is
          # codesign prompting for a locked keychain on a headless runner (no round-5
          # re-unlock). Fail loud here instead of hanging for the step timeout.
          if ! security find-identity -v -p codesigning "${KC}" | grep -q "1 valid identities\|[2-9] valid identities"; then
            echo "::error::no valid signing identity after unlock"; security find-identity -v -p codesigning; exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k action "${KC}" > /dev/null 2>&1 || true
          wails build -clean -tags goolm -platform darwin/universal
          APP="build/bin/GGCode Desktop.app"
          plutil -replace CFBundleIdentifier -string "gg.ai.ggcode" "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${GGCODE_VERSION#v}" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$(date -u +%Y%m%d01)" "$APP/Contents/Info.plist"
          plutil -replace LSMinimumSystemVersion -string "12.0" "$APP/Contents/Info.plist"
          cp "${RUNNER_TEMP}/mas.mobileprovision" "$APP/Contents/embedded.provisionprofile" 2>/dev/null || true
          # Re-derive the profile here: RUNNER_TEMP is shared across steps of
          # the same job, but decoding once more is cheap and keeps this step
          # self-sufficient.
          printf '%s' "${APPLE_MAS_PROFILE_BASE64}" | base64 -d > "${RUNNER_TEMP}/mas.mobileprovision"
          cp "${RUNNER_TEMP}/mas.mobileprovision" "$APP/Contents/embedded.provisionprofile"
          cat > "${RUNNER_TEMP}/mas_ent.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.network.server</key><true/>
            <key>com.apple.security.files.user-selected.read-write</key><true/>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.application-identifier</key><string>EGZFS7M525.gg.ai.ggcode</string>
            <key>com.apple.developer.team-identifier</key><string>EGZFS7M525</string>
          </dict>
          </plist>
          PLIST
          codesign --force --sign "Apple Distribution: Junjun Zhang (EGZFS7M525)" \
            --entitlements "${RUNNER_TEMP}/mas_ent.plist" --options runtime --timestamp "$APP"
          codesign --verify --deep --strict "$APP"
          productbuild --component "$APP" /Applications \
            --sign "3rd Party Mac Developer Installer: Junjun Zhang (EGZFS7M525)" \
            --timestamp "${RUNNER_TEMP}/GGCode_Desktop_MAS.pkg"
          echo "PKG_PATH=${RUNNER_TEMP}/GGCode_Desktop_MAS.pkg" >> "${GITHUB_ENV}"

      - name: Validate package (altool --validate-package)
        if: env.MAS_READY == 'true'
        shell: bash
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${APPLE_API_KEY_P8}" | base64 -d > ~/private_keys/AuthKey_"${APPLE_API_KEY_ID}".p8
          xcrun altool --validate-package -f "${PKG_PATH}" -t macOS \
            --apiKey "${APPLE_API_KEY_ID}" --api-issuer "${APPLE_API_ISSUER_ID}"

      - name: Upload package (altool --upload-package)
        if: env.MAS_READY == 'true'
        shell: bash
        run: |
          xcrun altool --upload-package -f "${PKG_PATH}" -t macOS \
            --apiKey "${APPLE_API_KEY_ID}" --api-issuer "${APPLE_API_ISSUER_ID}"

      - name: Poll processing and submit for review
        if: env.MAS_READY == 'true' && env.APPLE_API_KEY_P8 != ''
        shell: bash
        env:
          SUBMIT_FOR_REVIEW: "true"
        run: |
          chmod +x scripts/release/mas-submit-review.sh
          ./scripts/release/mas-submit-review.sh \
            --bundle-id "gg.ai.ggcode" \
            --version "${GGCODE_VERSION#v}" \
            --platform MAC_OS \
            --key-path ~/private_keys/AuthKey_"${APPLE_API_KEY_ID}".p8 \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER_ID}" \
            --max-wait 40
