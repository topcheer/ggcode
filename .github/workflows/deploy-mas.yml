name: Deploy Mac App Store

# Dedicated MAS pipeline, split out of release-mas.yml (which stays as the
# multi-platform release/publish pipeline). Upstream (wails universal build,
# Distribution signing, sandbox entitlements, productbuild) is identical to
# the previous inline block; what changed:
#   1. Own workflow: a MAS-only failure or retry no longer rides a 13-job
#      dispatch (the startup_failure streak lived there).
#   2. altool upload migrated from the deprecated --upload-app flag to
#      --upload-package, with --validate-package first (Apple's asc-altool
#      page marks --upload-app deprecated).
#   3. Submit-for-review is automated: poll the build through ASC API
#      processing (VALID), then drive the reviewSubmissions API (the
#      appStoreVersionSubmissions endpoint is deprecated and 403s, see the
#      2026-11-06 iOS/macOS submission round). Implemented in
#      scripts/release/mas-submit-review.sh.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package_version:
        description: "Version label for manual packaging runs"
        required: false
        default: "v0.0.0"

concurrency:
  group: deploy-mas-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit-mas:
    name: Build, sign and submit GGCode Desktop (MAS)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
      APPLE_MAC_INSTALLER_P12: ${{ secrets.APPLE_MAC_INSTALLER_P12 }}
      APPLE_MAC_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_P12_PASSWORD }}
      APPLE_MAS_DISTRIBUTION_P12: ${{ secrets.APPLE_MAS_DISTRIBUTION_P12 }}
      APPLE_MAS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_MAS_DISTRIBUTION_P12_PASSWORD }}
      APPLE_MAS_PROFILE_BASE64: ${{ secrets.APPLE_MAS_PROFILE_BASE64 }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions 2>/dev/null || true
          df -h /
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Capture build date
        shell: bash
        run: echo "GGCODE_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_ENV}"

      - name: Guard - MAS secrets configured?
        shell: bash
        run: |
          if [[ -z "${APPLE_MAC_INSTALLER_P12}" || -z "${APPLE_MAS_DISTRIBUTION_P12}" || -z "${APPLE_MAS_PROFILE_BASE64}" || -z "${APPLE_API_KEY_ID}" ]]; then
            echo "MAS secrets not configured - skipping (set APPLE_MAC_INSTALLER_P12, APPLE_MAS_DISTRIBUTION_P12, APPLE_MAS_PROFILE_BASE64, APPLE_API_KEY_ID[, APPLE_API_KEY_P8, APPLE_API_ISSUER_ID] to enable full automation)"
            exit 0
          fi
          echo "MAS_READY=true" >> "${GITHUB_ENV}"

      - name: Prepare Mac App Store credentials (canonical temp keychain)
        if: env.MAS_READY == 'true'
        shell: bash
        run: |
          # WHOLE-STEP WATCHDOG (run3 42186107234 hung 23min inside this step;
          # probe alarm only covers the 3-byte sign, not the security ops).
          # Alarm kills the subshell -> named timeout in log, never a hang.
          perl -e 'alarm 240; $SIG{ALRM}=sub{ print "::error::CREDENTIALS STEP TIMED OUT (240s) - hang in security op above last printed marker\n"; exit 9 }; exec @ARGV' bash -euo pipefail <<'WATCHDOG'
          set -x
          # RECIPE CHANGE (run 1+2 both hung at codesign "replacing existing
          # signature"): the login-keychain route contradicts the canonical
          # pattern (GitHub docs "Installing an Apple certificate on macOS
          # runners" + our own proven DMG lane in
          # scripts/release/build-desktop-darwin.sh, which has signed every
          # release without a single hang). Round-7's "custom keychain yields
          # CSSMERR_TP_NOT_TRUSTED forever" verdict was diagnosed while the
          # p12s were corrupt copies - invalid for rebuilt certs. Mirror the
          # DMG lane exactly: dedicated temp keychain with a fresh password,
          # import -A, partition-list with THAT password, search-list first,
          # and codesign --keychain (so it can never resolve identities or
          # ACLs from the runner login keychain).
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-$(date +%s)"
          echo "KC_PATH=${KEYCHAIN}" >> "${GITHUB_ENV}"
          echo "KC_PASSWORD=${KEYCHAIN_PASSWORD}" >> "${GITHUB_ENV}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "=== import installer p12 ==="
          set +x
          printf '%s' "${APPLE_MAC_INSTALLER_P12}" | base64 -d > "${RUNNER_TEMP}/installer.p12"
          openssl pkcs12 -info -in "${RUNNER_TEMP}/installer.p12" -noout -passin "pass:${APPLE_MAC_INSTALLER_P12_PASSWORD}" 2>&1 | head -3 || echo "::warning::installer p12 pre-parse failed"
          if ! perl -e 'alarm 90; $SIG{ALRM}=sub{ print "::error::INSTALLER P12 IMPORT TIMED OUT (90s) - security import hung\n"; exit 9 }; exec @ARGV'  security import "${RUNNER_TEMP}/installer.p12" -k "${KEYCHAIN}"  -P "${APPLE_MAC_INSTALLER_P12_PASSWORD}" -A -t cert -f pkcs12 2>&1; then
            echo "::error::installer p12 import failed/timed out (see above)"; exit 1
          fi
          set -x
          echo "=== import distribution p12 ==="
          set +x
          printf '%s' "${APPLE_MAS_DISTRIBUTION_P12}" | base64 -d > "${RUNNER_TEMP}/dist.p12"
          openssl pkcs12 -info -in "${RUNNER_TEMP}/dist.p12" -noout -passin "pass:${APPLE_MAS_DISTRIBUTION_P12_PASSWORD}" 2>&1 | head -3 || echo "::warning::dist p12 pre-parse failed"
          if ! perl -e 'alarm 90; $SIG{ALRM}=sub{ print "::error::DISTRIBUTION P12 IMPORT TIMED OUT (90s) - security import hung\n"; exit 9 }; exec @ARGV'  security import "${RUNNER_TEMP}/dist.p12" -k "${KEYCHAIN}"  -P "${APPLE_MAS_DISTRIBUTION_P12_PASSWORD}" -A -t cert -f pkcs12 2>&1; then
            echo "::error::distribution p12 import failed/timed out (see above)"; exit 1
          fi
          set -x
          echo "=== import WWDR G3 + verify presence ==="
          # Idempotent import: G3 is already present on the runner from the
          # DMG lane's own imports (and login-KC reuse), and security exits
          # nonzero on duplicates, which bash -e would kill the step on
          # (run4 42196592308: SecKeychainItemImport already exists). Treat
          # already-present as success; the next line's find-certificate is
          # the real gate anyway.
          security import "${GITHUB_WORKSPACE}/scripts/certs/AppleWWDRCAG3.pem" -k "${KEYCHAIN}" -T /usr/bin/codesign 2>&1 | grep -v "already exists in the keychain" || true
          security find-certificate -c "Apple Worldwide Developer Relations" "${KEYCHAIN}" 2>&1 | head -2
          echo "=== partition-list (temp-KC password, visible) ==="
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" 2>&1 | tail -2
          echo "=== search-list first ==="
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d ' "')
          echo "=== identity list (temp KC only) ==="
          security find-identity -v -p codesigning "${KEYCHAIN}" 2>&1
          echo "=== PROBE: 60s throwaway-binary signature ==="
          PROBE_BIN="${RUNNER_TEMP}/probe.bin"
          printf '#!/bin/sh\n' > "${PROBE_BIN}"; chmod +x "${PROBE_BIN}"
          set +x
          if ! perl -e 'alarm 60; exec @ARGV' codesign -f -vvv -s "Apple Distribution: Junjun Zhang (EGZFS7M525)" --keychain "${KEYCHAIN}" "${PROBE_BIN}" 2>&1; then
            echo "::error::PROBE SIGN FAILED/TIMED OUT (60s) - key access problem, NOT bundle-specific. codesign -vvv output above."; exit 1
          fi
          set -x
          echo "PROBE OK: key access works via temp keychain"
          WATCHDOG

      - name: Build and sign universal MAS app (verbose + watchdogs)
        if: env.MAS_READY == 'true'
        shell: bash
        run: |
          set -x
          cd desktop/ggcode-desktop-wails
          KC="${KC_PATH}"
          echo "=== re-unlock temp KC after wails window (fail-loud) ==="
          security unlock-keychain -p "${KC_PASSWORD}" "${KC}" 2>&1 || { echo "::error::re-unlock failed"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KC_PASSWORD}" "${KC}" 2>&1 | tail -2
          echo "=== identity gate ==="
          security find-identity -v -p codesigning "${KC}" 2>&1
          wails build -clean -tags goolm -platform darwin/universal
          APP="build/bin/GGCode Desktop.app"
          plutil -replace CFBundleIdentifier -string "gg.ai.ggcode" "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${GGCODE_VERSION#v}" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$(date -u +%Y%m%d01)" "$APP/Contents/Info.plist"
          plutil -replace LSMinimumSystemVersion -string "12.0" "$APP/Contents/Info.plist"
          printf '%s' "${APPLE_MAS_PROFILE_BASE64}" | base64 -d > "${RUNNER_TEMP}/mas.mobileprovision"
          cp "${RUNNER_TEMP}/mas.mobileprovision" "$APP/Contents/embedded.provisionprofile"
          cat > "${RUNNER_TEMP}/mas_ent.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.network.server</key><true/>
            <key>com.apple.security.files.user-selected.read-write</key><true/>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.application-identifier</key><string>EGZFS7M525.gg.ai.ggcode</string>
            <key>com.apple.developer.team-identifier</key><string>EGZFS7M525</string>
          </dict>
          </plist>
          PLIST
          echo "=== codesign app (300s watchdog, -vvv, temp keychain) ==="
          set +x
          if ! perl -e 'alarm 300; exec @ARGV' codesign -f -vvv --keychain "${KC}"  --sign "Apple Distribution: Junjun Zhang (EGZFS7M525)"  --entitlements "${RUNNER_TEMP}/mas_ent.plist" --options runtime --timestamp "$APP" 2>&1; then
            echo "::error::codesign app failed/timed out (300s) - full -vvv output above"; exit 1
          fi
          set -x
          echo "=== verify (verbose) ==="
          codesign --verify --deep --strict --verbose=4 --keychain "${KC}" "$APP" 2>&1
          echo "=== productbuild (300s watchdog, installer identity from temp KC) ==="
          set +x
          if ! perl -e 'alarm 300; exec @ARGV' productbuild --component "$APP" /Applications  --sign "3rd Party Mac Developer Installer: Junjun Zhang (EGZFS7M525)"  --keychain "${KC}"  --timestamp "${RUNNER_TEMP}/GGCode_Desktop_MAS.pkg" 2>&1; then
            echo "::error::productbuild failed/timed out (300s) - output above"; exit 1
          fi
          set -x
          ls -l "${RUNNER_TEMP}/GGCode_Desktop_MAS.pkg"
          echo "PKG_PATH=${RUNNER_TEMP}/GGCode_Desktop_MAS.pkg" >> "${GITHUB_ENV}"
          echo "=== cleanup temp keychain (no-op if job fails earlier) ==="
          security delete-keychain "${KC}" 2>/dev/null || true

      - name: Validate package (altool --validate-app)
        if: env.MAS_READY == 'true'
        shell: bash
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${APPLE_API_KEY_P8}" | base64 -d > ~/private_keys/AuthKey_"${APPLE_API_KEY_ID}".p8
          xcrun altool --validate-package -f "${PKG_PATH}" -t macOS  --apiKey "${APPLE_API_KEY_ID}" --api-issuer "${APPLE_API_ISSUER_ID}"

      - name: Upload package (altool --upload-package)
        if: env.MAS_READY == 'true'
        shell: bash
        run: |
          xcrun altool --upload-package -f "${PKG_PATH}" -t macOS  --apiKey "${APPLE_API_KEY_ID}" --api-issuer "${APPLE_API_ISSUER_ID}"

      - name: Poll processing and submit for review
        if: env.MAS_READY == 'true' && env.APPLE_API_KEY_P8 != ''
        shell: bash
        env:
          SUBMIT_FOR_REVIEW: "true"
        run: |
          chmod +x scripts/release/mas-submit-review.sh
          ./scripts/release/mas-submit-review.sh  --bundle-id "gg.ai.ggcode"  --version "${GGCODE_VERSION#v}"  --platform MAC_OS  --key-path ~/private_keys/AuthKey_"${APPLE_API_KEY_ID}".p8  --key-id "${APPLE_API_KEY_ID}"  --issuer "${APPLE_API_ISSUER_ID}"  --max-wait 40
