name: Release MAS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package_version:
        description: "Version label for manual packaging runs"
        required: false
        default: "v0.0.0"

concurrency:
  group: release-mas-b4-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # attestations/id-token (OIDC) removed round 8: no step consumes them and
  # dispatches started uniformly failing at startup (0 jobs) from 12:2x UTC
  # on 2026-11-05 - suspected GitHub OIDC backend outage. site-release.yml
  # (no such block) stayed green throughout. Restore only if an attestation
  # publisher step is ever added.

jobs:
  build-desktop-darwin:
    name: Build desktop macOS
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions 2>/dev/null || true
          df -h /
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Capture build date
        shell: bash
        run: echo "GGCODE_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_ENV}"
      - name: bisect-cut-ok
        run: echo ok
