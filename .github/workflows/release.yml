name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package_version:
        description: "Version label for manual packaging runs"
        required: false
        default: "v0.0.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  verify:
    name: Verify release inputs
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go build -tags goolm -o /tmp/ggcode-release ./cmd/ggcode
      - run: GOMEMLIMIT=2GiB GOGC=50 go test -tags goolm -p 1 -timeout 300s $(go list -tags goolm ./... | grep -v /desktop | grep -v ggcode-desktop)
      - run: go vet -tags goolm $(go list -tags goolm ./... | grep -v /desktop | grep -v ggcode-desktop)

  release:
    name: Build & Release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success') }}
    runs-on: ubuntu-latest
    needs: verify
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions
          df -h /
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true
          version: latest
      - name: Validate GoReleaser config
        run: goreleaser check || true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: ${{ github.event_name == 'workflow_dispatch' && 'release --snapshot --clean --skip=publish' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Render release notes
        if: github.event_name != 'workflow_dispatch'
        run: |
          chmod +x ./scripts/release/render-notes.sh
          ./scripts/release/render-notes.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" > /tmp/release-notes.md
      - name: Apply release notes
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file /tmp/release-notes.md
      - name: Upload GoReleaser dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goreleaser-dist
          path: dist/



  release-macos-pkg:
    name: Build macOS pkg
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success') }}
    runs-on: macos-latest
    needs:
      - verify
    permissions:
      contents: write
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions 2>/dev/null || true
          df -h /
      - name: Capture build date
        shell: bash
        run: echo "GGCODE_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_ENV}"
      - name: Build macOS installer package
        shell: bash
        run: |
          chmod +x ./scripts/release/build-macos-pkg.sh
          ./scripts/release/build-macos-pkg.sh "${GGCODE_VERSION}" dist
      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg

  release-windows-msi:
    name: Build Windows msi
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success') }}
    runs-on: windows-latest
    needs:
      - verify
    permissions:
      contents: write
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          wix --version
      - name: Capture build date
        shell: pwsh
        run: |
          $date = git show -s --format=%cI $env:GITHUB_SHA
          Add-Content -Path $env:GITHUB_ENV -Value "GGCODE_DATE=$date"
      - name: Build Windows MSI packages
        shell: pwsh
        run: .\scripts\release\build-windows-msi.ps1 -Version $env:GGCODE_VERSION -OutputDir dist
      - name: Upload Windows MSI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi

  build-desktop-darwin:
    name: Build desktop macOS
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success') }}
    runs-on: macos-latest
    needs:
      - verify
    permissions:
      contents: write
    env:
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghcActions 2>/dev/null || true
          df -h /
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Capture build date
        shell: bash
        run: echo "GGCODE_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_ENV}"
      - name: Prepare Apple signing credentials
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -n "${APPLE_DEVELOPER_ID_P12}" && -n "${APPLE_API_KEY_P8}" ]]; then
            echo "APPLE_SIGN_IDENTITY=Developer ID Application: Junjun Zhang (EGZFS7M525)" >> "${GITHUB_ENV}"
            P12_FILE="${RUNNER_TEMP}/cert.p12"
            printf '%s' "${APPLE_DEVELOPER_ID_P12}" | base64 -d > "${P12_FILE}"
            echo "APPLE_DEVELOPER_ID_P12_PATH=${P12_FILE}" >> "${GITHUB_ENV}"
            printf '%s\n' "APPLE_DEVELOPER_ID_P12_PASSWORD=${APPLE_DEVELOPER_ID_P12_PASSWORD}" >> "${GITHUB_ENV}"

            KEY_FILE="${RUNNER_TEMP}/AuthKey.p8"
            printf '%s' "${APPLE_API_KEY_P8}" | base64 -d > "${KEY_FILE}"
            echo "APPLE_API_KEY_PATH=${KEY_FILE}" >> "${GITHUB_ENV}"
            echo "APPLE_API_KEY_ID=${APPLE_API_KEY_ID}" >> "${GITHUB_ENV}"
            echo "APPLE_API_ISSUER_ID=${APPLE_API_ISSUER_ID}" >> "${GITHUB_ENV}"
            echo "Apple signing credentials prepared"
          else
            echo "No Apple signing credentials found — building unsigned"
          fi
      - name: Build desktop macOS DMG
        shell: bash
        run: |
          chmod +x ./scripts/release/build-desktop-darwin.sh
          ./scripts/release/build-desktop-darwin.sh "${GGCODE_VERSION}" dist
      - name: Upload desktop macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-darwin
          path: |
            dist/*.dmg
            dist/ggcode-desktop_*_darwin_*

      # ------------------------------------------------------------------
      # Mac App Store submission (same trigger/credentials flow as the iOS
      # TestFlight lane): builds a sandboxed universal .app with the MAS
      # bundle id, embeds the provisioning profile, signs with the Apple
      # Distribution identity, packages with the Mac Installer identity and
      # uploads via altool. Runs only when MAS secrets are configured.
      # ------------------------------------------------------------------
      - name: Prepare Mac App Store credentials
        shell: bash
        env:
          APPLE_MAC_INSTALLER_P12: ${{ secrets.APPLE_MAC_INSTALLER_P12 }}
          APPLE_MAC_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_MAC_INSTALLER_P12_PASSWORD }}
          APPLE_MAS_DISTRIBUTION_P12: ${{ secrets.APPLE_MAS_DISTRIBUTION_P12 }}
          APPLE_MAS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_MAS_DISTRIBUTION_P12_PASSWORD }}
          APPLE_MAS_PROFILE_BASE64: ${{ secrets.APPLE_MAS_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [[ -z "${APPLE_MAC_INSTALLER_P12}" || -z "${APPLE_MAS_DISTRIBUTION_P12}" || -z "${APPLE_MAS_PROFILE_BASE64}" || -z "${APPLE_API_KEY_ID}" ]]; then
            echo "MAS secrets not configured — skipping Mac App Store submission"
            exit 0
          fi
          # Run 41992253525 root cause: the keychain must be addressed by an
          # ABSOLUTE path. With a bare file name, `security list-keychains -s`
          # stores the relative name in the user search list; find-identity
          # (running from the repo root) resolves it, but codesign (running
          # later from the desktop build directory) cannot - its trust
          # evaluation silently falls back to the default keychains, loses
          # both the leaf and the WWDR intermediate, and fails with
          # "unable to build chain to self-signed root" + errSecInternalComponent.
          KEYCHAIN="$RUNNER_TEMP/mas-build.keychain-db"
          security create-keychain -p actions "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p actions "${KEYCHAIN}"
          printf '%s' "${APPLE_MAC_INSTALLER_P12}" | base64 -d > "${RUNNER_TEMP}/installer.p12"
          security import "${RUNNER_TEMP}/installer.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_MAC_INSTALLER_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          # Apple Distribution identity (.app signing) ships in its own p12 -
          # a single p12 cannot carry two private keys, so we import a second one.
          printf '%s' "${APPLE_MAS_DISTRIBUTION_P12}" | base64 -d > "${RUNNER_TEMP}/dist.p12"
          security import "${RUNNER_TEMP}/dist.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_MAS_DISTRIBUTION_P12_PASSWORD}" -T /usr/bin/codesign
          # A p12 carries only the leaf cert + private key. Codesign needs the
          # full chain to the Apple root, so import the WWDR G3 intermediate
          # (the issuer of our Distribution certs). Apple has removed the G3
          # download page, so the cert ships in-repo (public trust material).
          security import "${GITHUB_WORKSPACE}/scripts/certs/AppleWWDRCAG3.pem" -k "${KEYCHAIN}" -T /usr/bin/codesign
          # Grant the runner's codesign access to the imported private keys.
          # Without a partition list the keychain ACL blocks codesign with
          # errSecInternalComponent (run 41971828737: both p12s + G3 imported
          # fine, find-identity reported 0 valid identities, codesign failed).
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db
          security find-identity -v -p codesigning
          # Diagnostics for the "0 valid identities" chain problem
          # (runs 41971828737 / 41980707576: imports all green, identity
          # validity still zero). Dump leaf + intermediate validity windows
          # and run a full trust-chain verification so the next fix is
          # evidence-driven, not guess-driven.
          echo "--- identity list (incl. invalid) ---"
          security find-identity -p codesigning || true
          # Run 41986711593 verdict: CSSMERR_TP_NOT_TRUSTED while PEM-level
          # verify-cert succeeds -> the break is issuer resolution, most
          # likely the leaf was issued by a WWDR generation (G2?) that we
          # do not have in the keychain. Dump issuer/subject of every
          # certificate so the missing link is named exactly.
          for CERT_NAME in "Apple Distribution" "Apple Worldwide Developer Relations"; do
            PEM=$(security find-certificate -c "$CERT_NAME" -p "${KEYCHAIN}" 2>/dev/null | head -1)
            if [[ -n "$PEM" ]]; then
              echo "--- $CERT_NAME (all matches) ---"
              security find-certificate -c "$CERT_NAME" -p "${KEYCHAIN}" 2>/dev/null | csplit -szf /tmp/cert_ - '/-----BEGIN CERTIFICATE-----/' '{*}' 2>/dev/null || true
              for C in /tmp/cert_*; do
                [[ -s "$C" ]] || continue
                echo "  [$(basename $C)]"
                openssl x509 -noout -subject -issuer -dates -in "$C" 2>/dev/null | sed 's/^/    /'
              done
            else
              echo "--- $CERT_NAME: NOT FOUND in ${KEYCHAIN} ---"
            fi
          done
          echo "--- Apple roots visible to this runner (search for G2/G3 roots) ---"
          security find-certificate -a -p /Library/Keychains/System.keychain 2>/dev/null | awk '/BEGIN/{n++} n' | csplit -szf /tmp/root_ - '/-----BEGIN CERTIFICATE-----/' '{*}' 2>/dev/null || true
          for C in /tmp/root_*; do
            [[ -s "$C" ]] || continue
            S=$(openssl x509 -noout -subject -in "$C" 2>/dev/null)
            case "$S" in *Apple*) echo "  $S";; esac
          done
          echo "--- trust chain verify ---"
          security find-certificate -c "Apple Distribution" -p "${KEYCHAIN}" > /tmp/leaf.pem 2>/dev/null || true
          security find-certificate -p "${KEYCHAIN}" > /tmp/all.pem 2>/dev/null || true
          cat /tmp/leaf.pem /tmp/all.pem > /tmp/chain.pem 2>/dev/null || true
          security verify-cert -c /tmp/leaf.pem -p codesign -r /tmp/chain.pem 2>&1 || true
          printf '%s' "${APPLE_MAS_PROFILE_BASE64}" | base64 -d > "${RUNNER_TEMP}/mas.mobileprovision"
          mkdir -p ~/private_keys
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then cp "${APPLE_API_KEY_PATH}" ~/private_keys/AuthKey_"${APPLE_API_KEY_ID}".p8; fi
          echo "MAS_READY=true" >> "${GITHUB_ENV}"

      - name: Submit desktop app to Mac App Store
        if: env.MAS_READY == 'true'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cd desktop/ggcode-desktop-wails
          # universal sandboxed build with the MAS bundle id
          wails build -clean -tags goolm -platform darwin/universal
          APP="build/bin/GGCode Desktop.app"
          plutil -replace CFBundleIdentifier -string "gg.ai.ggcode" "$APP/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${GGCODE_VERSION#v}" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$(date -u +%Y%m%d01)" "$APP/Contents/Info.plist"
          plutil -replace LSMinimumSystemVersion -string "12.0" "$APP/Contents/Info.plist"
          cp "${RUNNER_TEMP}/mas.mobileprovision" "$APP/Contents/embedded.provisionprofile"
          cat > "${RUNNER_TEMP}/mas_ent.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key><true/>
            <key>com.apple.security.network.client</key><true/>
            <key>com.apple.security.network.server</key><true/>
            <key>com.apple.security.files.user-selected.read-write</key><true/>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.application-identifier</key><string>EGZFS7M525.gg.ai.ggcode</string>
            <key>com.apple.developer.team-identifier</key><string>EGZFS7M525</string>
          </dict>
          </plist>
          PLIST
          codesign --force --sign "Apple Distribution: Junjun Zhang (EGZFS7M525)" \
            --entitlements "${RUNNER_TEMP}/mas_ent.plist" --options runtime --timestamp "$APP"
          codesign --verify --deep --strict "$APP"
          productbuild --component "$APP" /Applications \
            --sign "3rd Party Mac Developer Installer: Junjun Zhang (EGZFS7M525)" \
            --timestamp "${RUNNER_TEMP}/GGCode_Desktop_MAS.pkg"
          xcrun altool --upload-app -f "${RUNNER_TEMP}/GGCode_Desktop_MAS.pkg" -t macOS \
            --apiKey "${APPLE_API_KEY_ID}" --api-issuer "${APPLE_API_ISSUER_ID}"

  build-desktop-windows:
    name: Build desktop Windows
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success') }}
    runs-on: windows-latest
    needs:
      - verify
    permissions:
      contents: write
    env:
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install GCC (MinGW)
        shell: pwsh
        run: choco install mingw --yes
      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
          wix --version
      - name: Install Wails CLI
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Capture build date
        shell: pwsh
        run: |
          $date = git show -s --format=%cI $env:GITHUB_SHA
          Add-Content -Path $env:GITHUB_ENV -Value "GGCODE_DATE=$date"
      - name: Build desktop Windows
        shell: pwsh
        run: |
          .\scripts\release\build-desktop-windows.ps1 -Version $env:GGCODE_VERSION -OutputDir dist
      - name: Upload desktop Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/ggcode-desktop_*

  build-desktop-linux-amd64:
    name: Build desktop Linux amd64
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success') }}
    runs-on: ubuntu-22.04
    needs:
      - verify
    permissions:
      contents: write
    env:
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libgtk-3-dev libwebkit2gtk-4.0-dev patchelf squashfs-tools desktop-file-utils
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Capture build date
        shell: bash
        run: echo "GGCODE_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_ENV}"
      - name: Build desktop Linux
        shell: bash
        run: |
          chmod +x ./scripts/release/build-desktop-linux.sh
          ./scripts/release/build-desktop-linux.sh "${GGCODE_VERSION}" dist
      - name: Upload desktop Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-amd64
          path: dist/ggcode-desktop_*

  build-desktop-linux-arm64:
    name: Build desktop Linux arm64
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.verify.result == 'success') }}
    runs-on: ubuntu-22.04-arm
    needs:
      - verify
    permissions:
      contents: write
    env:
      GGCODE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.package_version || github.ref_name }}
      GGCODE_COMMIT: ${{ github.sha }}
      CGO_ENABLED: 1
      GOTOOLCHAIN: local
      TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libgtk-3-dev libwebkit2gtk-4.0-dev patchelf squashfs-tools desktop-file-utils
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Capture build date
        shell: bash
        run: echo "GGCODE_DATE=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_ENV}"
      - name: Build desktop Linux
        shell: bash
        run: |
          chmod +x ./scripts/release/build-desktop-linux.sh
          ./scripts/release/build-desktop-linux.sh "${GGCODE_VERSION}" dist
      - name: Upload desktop Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-arm64
          path: dist/ggcode-desktop_*

  upload-release-assets:
    name: Upload release assets
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs:
      - release
      - release-macos-pkg
      - release-windows-msi
      - build-desktop-darwin
      - build-desktop-windows
      - build-desktop-linux-amd64
      - build-desktop-linux-arm64
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: dist/macos-pkg
      - uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: dist/windows-msi
      - uses: actions/download-artifact@v4
        with:
          name: desktop-darwin
          path: dist/desktop-darwin
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist/desktop-windows
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-amd64
          path: dist/desktop-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux-arm64
          path: dist/desktop-linux-arm64
      - name: Upload all extra assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Upload each asset group separately so one failure doesn't block others
          for pattern in \
            "dist/macos-pkg/*.pkg" \
            "dist/windows-msi/*.msi" \
            "dist/desktop-darwin/*.dmg" \
            "dist/desktop-darwin/ggcode-desktop_*_darwin_*" \
            "dist/desktop-windows/*" \
            "dist/desktop-linux-amd64/ggcode-desktop_*" \
            "dist/desktop-linux-arm64/ggcode-desktop_*"; do
            files=( $pattern )
            if [ ${#files[@]} -gt 0 ] && [ -e "${files[0]}" ]; then
              echo "Uploading: $pattern (${#files[@]} file(s))"
              gh release upload "${GITHUB_REF_NAME}" $pattern --clobber || echo "WARN: failed to upload $pattern"
            else
              echo "SKIP: no files matching $pattern"
            fi
          done

  publish-winget:
    name: Publish desktop to winget
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    needs:
      - upload-release-assets
    permissions:
      contents: read
    env:
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
      WINGET_PACKAGE_ID: gg.ai.ggcode-desktop
    steps:
      - uses: actions/checkout@v6
      - name: Sync winget-pkgs fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          for ($i = 1; $i -le 3; $i++) {
            gh api repos/topcheer/winget-pkgs/merge-upstream -X POST -f branch=master 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "winget-pkgs fork synced successfully (attempt $i)."
              exit 0
            }
            Write-Host "::Warning::Fork sync attempt $i failed (exit $LASTEXITCODE). Retrying in 5s..."
            Start-Sleep -Seconds 5
          }
          Write-Host "::Error::Fork sync failed after 3 attempts; a stale fork base produced Internal-Error-PRs before (v1.3.273 #470562/#470563). Failing fast instead of submitting from a stale base."
          exit 1
      - name: Check for existing winget PR
        id: check-pr
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = "${{ github.ref_name }}" -replace '^v',''
          $existingPRs = gh pr list --repo microsoft/winget-pkgs `
            --search "is:pr is:open $env:WINGET_PACKAGE_ID $packageVersion" `
            --json number,title --jq 'length' 2>$null
          if ($existingPRs -and [int]$existingPRs -gt 0) {
            Write-Host "::Notice::Found $existingPRs open PR(s) for $env:WINGET_PACKAGE_ID $packageVersion. Skipping submission."
            echo "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "skip=false" >> $env:GITHUB_OUTPUT
          }
      - name: Submit or skip winget update
        if: steps.check-pr.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Host "WINGET_CREATE_GITHUB_TOKEN not configured; skipping winget submission."
            exit 0
          }
          $packageVersion = "${{ github.ref_name }}" -replace '^v',''
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $installerUrlX64 = "${baseUrl}/ggcode-desktop_${packageVersion}_windows_x64.msi"
          $installerUrlArm64 = "${baseUrl}/ggcode-desktop_${packageVersion}_windows_arm64.msi"
          .\scripts\release\publish-winget.ps1 `
            -PackageId $env:WINGET_PACKAGE_ID `
            -Version "${{ github.ref_name }}" `
            -InstallerUrl $installerUrlX64 `
            -InstallerUrlArm64 $installerUrlArm64 `
            -GitHubToken $env:WINGET_CREATE_GITHUB_TOKEN

